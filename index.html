<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Калькулятор выращивания</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">Калькулятор выращивания</div>

        <nav id="tabs" class="tabs" aria-label="Страницы"></nav>

        <!-- сюда страница кладёт свои параметры -->
        <div id="controls" class="controls"></div>

        <div class="side-foot">
          <button id="reset" class="btn" type="button">
            Сбросить параметры
          </button>
        </div>
      </aside>

      <div class="content">
        <header class="pagehead">
          <h1 id="page-title"></h1>
          <p id="page-sub"></p>
        </header>
        <main id="app" class="page"></main>
      </div>
    </div>

    <script src="js/vendor/chart.umd.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
